name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например v1.0.1 (пусто — просто собрать exe)"
        required: false
        default: ""
      notes:
        description: "Что нового (текст для релиза)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: pytest -q

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Reviews
          --exclude-module tkinter
          main.py

      - uses: actions/upload-artifact@v4
        with:
          name: Reviews-windows
          path: dist/Reviews.exe

      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Reviews.exe

      - name: Release (manual run with version)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/Reviews.exe
          body: ${{ inputs.notes }}
